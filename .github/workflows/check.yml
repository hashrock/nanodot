name: Check localization

# 訳のカタログ（Resources/*.xcstrings）と Swift 側の文言のずれを見る。Python だけで動くので ubuntu で足りる
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-localization.py
