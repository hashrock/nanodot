# iPad 版の Xcode プロジェクト（XcodeGen で生成する: cd iPad && xcodegen）
name: NanodotPad
options:
  bundleIdPrefix: com.hashrock
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
packages:
  Nanodot:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  NanodotPad:
    build:
      targets:
        NanodotPad: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  NanodotPad:
    type: application
    platform: iOS
    sources:
      - path: Nanodot
      # Mac 版と共有する描画の部品（Draw。AppKit に依存しない）
      - path: ../Sources/Nanodot/Shared
        group: Shared
      # プライバシーマニフェストは Mac 版と同じもの（UserDefaults だけ。収集なし）
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # 表示言語（日本語・英語）。訳のカタログは Mac 版と同じもの（MCP の表は入れない）
      - path: ../Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: Nanodot
        product: NanodotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hashrock.nanodot
        DEVELOPMENT_TEAM: 5WLLZHK49R
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Nanodot
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_ENTITLEMENTS: Nanodot/Nanodot.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nanodot
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
    info:
      path: Nanodot/Info.plist
      properties:
        # 版は上の MARKETING_VERSION / CURRENT_PROJECT_VERSION から入れる
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 暗号は使っていない（App Store Connect の輸出コンプライアンスの質問を省く）
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.graphics-design
        # 表示言語（App Store の「言語」に出る）
        CFBundleLocalizations: [ja, en]
        # 書類フォルダーをファイル App の「このiPad内 › Nanodot」に出す（LSSupportsOpeningDocumentsInPlace と両方要る。
        # INFOPLIST_KEY_UIFileSharingEnabled だけでは、できた Info.plist に入らない）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # iCloud container をファイル App の「iCloud Drive › Nanodot」に出す（Mac の Finder にも出る）
        NSUbiquitousContainers:
          iCloud.com.hashrock.nanodot:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Nanodot
            NSUbiquitousContainerSupportedFolderLevels: Any
        CFBundleDocumentTypes:
          - CFBundleTypeName: PNG Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.gif, com.microsoft.bmp, public.tiff, public.jpeg]
          # サイドカー（<名前>.nanodot）。ファイル App で選ぶと隣の PNG を開く
          - CFBundleTypeName: Nanodot Sheet Settings
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hashrock.nanodot.sheet-settings]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hashrock.nanodot.sheet-settings
            UTTypeDescription: Nanodot Sheet Settings
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [nanodot]
    # iCloud container（iCloud.com.hashrock.nanodot）。Apple Developer で container を登録し、App ID に iCloud（iCloud Documents）を
    # 付けてから使う。.ipa の書き出し（scripts/ipad-export.sh）は、App ID を変えないよう既定でこの entitlement を外す
    entitlements:
      path: Nanodot/Nanodot.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.hashrock.nanodot]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.hashrock.nanodot]
        com.apple.developer.icloud-services: [CloudDocuments]
